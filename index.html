<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- No browser translation: the app is translated already. Edge on an iPad offered to
         translate the page (it said "en", the app showed German), and the hidden accessibility
         text Compose keeps beside its canvas then showed over the app, garbled. -->
    <meta name="google" content="notranslate">
    <title>MusicBootCamp</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <script>
        // Kept to what old browsers understand: this has to run where the app cannot. A problem
        // is shown in a box over the page, which would otherwise stay blank (the app replaces the
        // page's content as it starts) or show the spinner forever. Every start keeps a log
        // (local storage, so it survives the browser stopping and reloading the page): any box
        // copies it, and the page opened with "?log" shows the last start's log without starting
        // the app.
        (function () {
            var german = /^de/i.test(navigator.language || '');
            // The language the app shows (it follows the system's), so no browser offers to translate it.
            document.documentElement.lang = german ? 'de' : 'en';
            var LOG_KEY = 'mbc-start-log';
            var t0 = Date.now();

            // ------------------------------------------------------------------ the log

            var previous = null;
            try {
                previous = localStorage.getItem(LOG_KEY);
            } catch (e) {
            }
            var lines = [];
            function log(text) {
                if (lines.length >= 400) return;
                lines.push('+' + (Date.now() - t0) + ' ms ' + text);
                try {
                    localStorage.setItem(LOG_KEY, lines.join('\n'));
                } catch (e) {
                }
            }
            function logText() {
                return 'MusicBootCamp start log\n' + lines.join('\n') +
                    (previous ? '\n\nThe start before:\n' + previous : '');
            }

            // ------------------------------------------------------------------ the box

            function copy(text, button) {
                function done() { button.textContent = german ? 'Kopiert' : 'Copied'; }
                function fallback() {
                    var area = document.createElement('textarea');
                    area.value = text;
                    area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
                    document.documentElement.appendChild(area);
                    area.focus();
                    area.select();
                    try { document.execCommand('copy'); done(); } catch (e) { }
                    area.parentNode.removeChild(area);
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(done, fallback);
                } else {
                    fallback();
                }
            }

            function show(title, details) {
                var box = document.getElementById('mbc-problem');
                if (!box) {
                    box = document.createElement('div');
                    box.id = 'mbc-problem';
                    box.setAttribute('role', 'alert');
                    box.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:2147483647;' +
                        'max-height:70%;overflow:auto;padding:16px;border-radius:12px;text-align:left;' +
                        'font:15px/1.4 -apple-system,system-ui,sans-serif;background:#fff3f0;color:#3b0d05;' +
                        'border:1px solid #e0a090;box-shadow:0 4px 16px rgba(0,0,0,.25);' +
                        '-webkit-user-select:text;user-select:text';
                    var close = document.createElement('button');
                    close.textContent = '×';
                    close.setAttribute('aria-label', german ? 'Schließen' : 'Close');
                    close.style.cssText = 'float:right;border:0;background:none;font-size:22px;line-height:1;color:inherit;cursor:pointer';
                    close.onclick = function () { box.parentNode.removeChild(box); };
                    box.appendChild(close);
                    var copyButton = document.createElement('button');
                    copyButton.textContent = german ? 'Protokoll kopieren' : 'Copy log';
                    copyButton.style.cssText = 'float:right;margin-right:12px;padding:4px 10px;border-radius:8px;' +
                        'border:1px solid #c08070;background:#fff;color:inherit;font:inherit;cursor:pointer';
                    copyButton.onclick = function () { copy(logText(), copyButton); };
                    box.appendChild(copyButton);
                    // Beside the body, which the app empties as it starts.
                    document.documentElement.appendChild(box);
                } else {
                    box.appendChild(document.createElement('hr'));
                }
                var heading = document.createElement('strong');
                heading.textContent = title;
                var text = document.createElement('div');
                text.style.cssText = 'margin-top:6px;white-space:pre-wrap;word-break:break-word';
                // The browser's own description, so a screenshot tells which one it was.
                text.textContent = details + '\n\n' + navigator.userAgent;
                box.appendChild(heading);
                box.appendChild(text);
            }

            // "?log": the last start's log, and no start (which may be what hangs).
            if (/[?&]log\b/.test(location.search)) {
                var spinnerOff = document.querySelector('body > svg');
                if (spinnerOff) spinnerOff.style.display = 'none';
                lines = [];
                show(german ? 'Protokoll des letzten Starts' : 'Log of the last start',
                    previous || (german ? '(keines gespeichert)' : '(none kept)'));
                lines = previous ? previous.split('\n') : [];
                previous = null;
                return;
            }

            log('start ' + new Date(t0).toISOString() + ' ' + location.href);
            log('browser ' + navigator.userAgent);
            log('screen ' + screen.width + 'x' + screen.height + ' @' + (window.devicePixelRatio || 1) +
                ', window ' + window.innerWidth + 'x' + window.innerHeight +
                ', touch ' + (navigator.maxTouchPoints || 0) + ', language ' + navigator.language +
                (navigator.deviceMemory ? ', memory ' + navigator.deviceMemory + ' GB' : '') +
                (navigator.hardwareConcurrency ? ', cores ' + navigator.hardwareConcurrency : ''));

            // ------------------------------------------------------------------ WebAssembly

            // The app needs WebAssembly even where it runs as JavaScript (drawing and the note
            // model are WebAssembly). Browsers too old for its WebAssembly build (garbage
            // collection: Safari and every browser on iPhone and iPad before 18.2) get the
            // JavaScript build; webApp.js decides.
            if (typeof WebAssembly !== 'object') {
                log('no WebAssembly');
                var spinner = document.querySelector('body > svg');
                if (spinner) spinner.style.display = 'none';
                show(german ? 'Dieser Browser kann MusicBootCamp nicht ausführen.' : 'This browser cannot run MusicBootCamp.',
                    german
                        ? 'WebAssembly ist ausgeschaltet. Auf iPhone und iPad tut das der Blockierungsmodus (Einstellungen → Datenschutz & Sicherheit → Blockierungsmodus; dort lässt sich diese Seite ausnehmen).'
                        : 'WebAssembly is switched off. On iPhone and iPad, Lockdown Mode does that (Settings → Privacy & Security → Lockdown Mode; this site can be excluded there).');
                return;
            }
            var gc = false;
            try {
                gc = WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 3, 1, 0x5f, 0]));
            } catch (e) {
            }
            log('WebAssembly ' + (gc ? 'with' : 'without') + ' garbage collection');

            // A browser that runs scripts without a JIT compiler (Edge's "enhanced security"
            // mode, often set by companies; Lockdown Mode) keeps WebAssembly, but interprets it:
            // the app then hardly gets to its first frame. A plain loop is timed against sorting
            // (native code, as fast without a JIT), so the device's speed cancels out. With a JIT
            // the loop takes at most 0.3 of the sort's time (Safari's engine, V8 0.16; up to 0.5
            // while the page is busy loading), without one 1.9 (Safari) or 4 (V8).
            var ratio = NaN;
            try {
                var data = new Float64Array(100000), seed = 1;
                for (var i = 0; i < data.length; i++) { seed = (seed * 16807) % 2147483647; data[i] = seed; }
                var loop = function (n) { var x = 0; for (var i = 0; i < n; i++) x = (x + i * 7) | 0; return x; };
                loop(20000);
                ratio = Infinity;
                for (var round = 0; round < 3; round++) {
                    var sorted = new Float64Array(data);
                    var a = performance.now();
                    sorted.sort();
                    var b = performance.now();
                    loop(1000000);
                    var c = performance.now();
                    ratio = Math.min(ratio, (c - b) / Math.max(b - a, 0.1));
                }
            } catch (e) {
                log('JIT probe failed: ' + e);
            }
            var noJit = ratio > 1.0;
            log('JIT probe ' + ratio.toFixed(2) + (noJit ? ': no JIT' : ': JIT'));
            if (noJit) {
                show(german ? 'Dieser Browser bremst die App stark.' : 'This browser slows the app down severely.',
                    german
                        ? 'Er führt Programme ohne Beschleunigung (JIT) aus, meist wegen eines Sicherheitsmodus: in Edge „Erweiterte Sicherheit beim Surfen“ (Einstellungen → Datenschutz und Sicherheit; dort lässt sich diese Seite als Ausnahme eintragen, auf Dienstgeräten legt das oft die Firma fest), auf iPhone und iPad der Blockierungsmodus. Die App startet dann vielleicht gar nicht. Safari oder ein Browser ohne diesen Modus hilft.'
                        : 'It runs programs without acceleration (JIT), mostly because of a security mode: in Edge "Enhanced security mode" (Settings → Privacy and security; this site can be added as an exception there, on company devices the company often sets it), on iPhone and iPad Lockdown Mode. The app may then not start at all. Safari, or a browser without this mode, helps.');
            }

            // ------------------------------------------------------------------ errors

            // Whatever goes wrong while the app starts or runs is shown, not only logged.
            var failure = german ? 'Fehler in MusicBootCamp' : 'Error in MusicBootCamp';
            function describe(error) {
                if (!error || typeof error !== 'object') return String(error);
                var text = (error.name ? error.name + ': ' : '') + (error.message || String(error));
                if (!error.stack) return text;
                // Chrome's stack starts with the message, Safari's and Firefox's do not.
                var stack = String(error.stack).split('\n');
                if (stack[0] === text) stack.shift();
                return text + '\n' + stack.slice(0, 6).join('\n');
            }
            window.addEventListener('error', function (event) {
                // Harmless: the browser could not deliver every size change in one frame.
                if (/ResizeObserver loop/.test(event.message || '')) return;
                var text = describe(event.error || event.message);
                log('error ' + text);
                show(failure, text);
            });
            window.addEventListener('unhandledrejection', function (event) {
                var text = describe(event.reason);
                log('unhandled rejection ' + text);
                show(failure, text);
            });
            // What the app and its libraries complain about (the loader, for one, only logs).
            ['error', 'warn'].forEach(function (level) {
                var original = console[level];
                if (typeof original !== 'function') return;
                console[level] = function () {
                    try {
                        log('console.' + level + ' ' + Array.prototype.map.call(arguments, function (x) {
                            return x instanceof Error ? describe(x) : String(x);
                        }).join(' ').slice(0, 500));
                    } catch (e) {
                    }
                    return original.apply(console, arguments);
                };
            });

            // ------------------------------------------------------------------ phases

            // Which build the loader (webApp.js) chose.
            function build() {
                var names = (performance.getEntriesByType ? performance.getEntriesByType('resource') : [])
                    .map(function (e) { return e.name; }).join(' ');
                return /originWasmWebApp/.test(names) ? 'WebAssembly' : /originJsWebApp/.test(names) ? 'JavaScript' : '?';
            }

            // The app reports "app" when its code runs and "ready" after its first frame (main.kt).
            var phases = {
                page: german ? 'Seite geladen, das Programm lief noch nicht an' : 'page loaded, the program had not started yet',
                app: german ? 'Programm gestartet, aber noch nichts gezeichnet' : 'program started, but nothing drawn yet',
            };
            var current = 'page';
            if (previous && !/\bphase ready\b/.test(previous) && !/\bno WebAssembly\b/.test(previous)) {
                var first = previous.split('\n')[0] || '';
                show(german ? 'Der letzte Start kam nicht bis zur App.' : 'The last start did not get to the app.',
                    (german
                        ? 'Wurde die Seite damals einfach geschlossen, ist das kein Fehler. Sonst hilft das Protokoll (Knopf oben).'
                        : 'If the page was simply closed then, this is no error. Otherwise the log helps (button above).') +
                    '\n' + first);
            }
            var watchdog = setTimeout(function () {
                log('still not ready after 30 s: ' + current + ', build ' + build());
                show(german ? 'Die App startet ungewöhnlich langsam.' : 'The app is unusually slow to start.',
                    (german ? 'Seit 30 Sekunden: ' : 'For 30 seconds: ') + phases[current] +
                    (german ? ' (Fassung: ' : ' (build: ') + build() + ', JIT ' + ratio.toFixed(2) + ').');
            }, 30000);
            // For the app's own notes (audio, see WebServices.kt).
            window.mbcLog = log;
            window.mbcPhase = function (phase) {
                current = phase;
                log('phase ' + phase + ', build ' + build());
                if (phase === 'ready') {
                    clearTimeout(watchdog);
                    // "Ready" means the app drew; whether that reached the screen is another
                    // matter (a blank page with the app running): look at its canvas a few times.
                    // Reported from within the app's first frame, before it draws: the first
                    // sample comes right after that drawing.
                    canvasReport();
                    [3000, 10000].forEach(function (delay) { setTimeout(canvasReport, delay); });
                    if (snapshotWanted) setTimeout(function () {
                        snapshotTries = 120;
                        // A resize makes the app lay out and draw again.
                        window.dispatchEvent(new Event('resize'));
                    }, 5000);
                }
            };

            // ------------------------------------------------------------------ the canvas

            // The app's canvas, inside a shadow root.
            function findCanvas(root) {
                var found = root.querySelector && root.querySelector('canvas');
                if (found) return found;
                var all = root.querySelectorAll ? root.querySelectorAll('*') : [];
                for (var i = 0; i < all.length; i++) {
                    if (all[i].shadowRoot) {
                        found = findCanvas(all[i].shadowRoot);
                        if (found) return found;
                    }
                }
                return null;
            }
            var watched = null;
            function canvasReport() {
                if (sampling) reportSampling();
                try {
                    var canvas = findCanvas(document);
                    if (!canvas) {
                        log('canvas: none');
                        return;
                    }
                    var r = canvas.getBoundingClientRect();
                    var b = document.body.getBoundingClientRect();
                    var view = window.visualViewport;
                    var text = 'canvas ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' at ' + Math.round(r.left) + ',' + Math.round(r.top) +
                        ', buffer ' + canvas.width + 'x' + canvas.height +
                        ', body ' + Math.round(b.width) + 'x' + Math.round(b.height) +
                        ', window ' + window.innerWidth + 'x' + window.innerHeight +
                        (view ? ', viewport ' + Math.round(view.width) + 'x' + Math.round(view.height) + ' scale ' + view.scale : '') +
                        ', ' + document.visibilityState;
                    // The context the app made (asking again returns it, or null for another kind).
                    var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
                    if (gl) {
                        var info = gl.getExtension('WEBGL_debug_renderer_info');
                        var attributes = gl.getContextAttributes() || {};
                        text += ', ' + (typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext ? 'WebGL 2' : 'WebGL 1') +
                            (gl.isContextLost() ? ' LOST' : '') +
                            ', drawing buffer ' + gl.drawingBufferWidth + 'x' + gl.drawingBufferHeight +
                            ', alpha ' + attributes.alpha + ', antialias ' + attributes.antialias +
                            (info ? ', ' + gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : '');
                    } else {
                        text += ', no WebGL context';
                    }
                    log(text);
                    if (watched !== canvas) {
                        watched = canvas;
                        canvas.addEventListener('webglcontextlost', function () { log('WebGL context lost'); });
                        canvas.addEventListener('webglcontextrestored', function () { log('WebGL context restored'); });
                    }
                    // A few pixels right after the app drew them (see the animation frames below).
                    if (gl && !gl.isContextLost()) sampling = { gl: gl, callbacks: 0, drawn: 0, pixels: '' };
                    if (gl) appGl = gl;
                } catch (e) {
                    log('canvas report failed: ' + e);
                }
            }
            // The app draws in animation frames; the browser clears what it drew once it showed it.
            // Read right after each callback, a few pixels tell whether anything was drawn at all.
            var sampling = null;
            function sample() {
                var gl = sampling.gl;
                try {
                    var w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, px = new Uint8Array(4), seen = [], any = false;
                    [[0.5, 0.5], [0.1, 0.1], [0.9, 0.9], [0.5, 0.95]].forEach(function (p) {
                        gl.readPixels(Math.floor(w * p[0]), Math.floor(h * p[1]), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
                        if (px[0] || px[1] || px[2] || px[3]) any = true;
                        seen.push(px.join('/'));
                    });
                    if (any) { sampling.drawn++; sampling.pixels = seen.join(' '); }
                } catch (e) {
                    log('canvas pixels unreadable: ' + e);
                    sampling = null;
                    return;
                }
                if (++sampling.callbacks >= 30) reportSampling();
            }
            // Frames come only while the app redraws; an idle app leaves the count short.
            function reportSampling() {
                log('canvas: something drawn after ' + sampling.drawn + ' of ' + sampling.callbacks + ' frame callbacks' +
                    (sampling.pixels ? ', pixels ' + sampling.pixels + ' (rgba, centre and corners)' : ''));
                sampling = null;
            }
            // Experiments for browsers that show the app's frames wrongly or not at all, chosen in
            // the address (and "?build=", see below): "?sync=finish" (or "flush", "read") makes
            // the GPU finish each frame the app drew; "?snapshot" shows, after 5 s, the app's drawing buffer as a plain image
            // beside it (is the buffer wrong, or only what the browser shows of it?).
            var syncMode = (location.search.match(/[?&]sync=(\w+)/) || [])[1];
            var snapshotWanted = /[?&]snapshot\b/.test(location.search);
            var appGl = null, snapshotTries = 0;
            if (syncMode) log('experiment: sync=' + syncMode + ' after every frame');
            function afterFrame() {
                if (sampling) sample();
                if (!appGl) return;
                if (syncMode === 'finish') appGl.finish();
                else if (syncMode === 'flush') appGl.flush();
                else if (syncMode === 'read') appGl.readPixels(0, 0, 1, 1, appGl.RGBA, appGl.UNSIGNED_BYTE, new Uint8Array(4));
                if (snapshotTries > 0) snapshot();
            }
            function snapshot() {
                var gl = appGl, w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
                var pixels = new Uint8Array(w * h * 4);
                gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
                var drawn = false;
                for (var i = 3; i < pixels.length; i += 4 * 997) if (pixels[i]) { drawn = true; break; }
                if (!drawn && --snapshotTries > 0) return; // cleared: the app did not draw in this frame
                snapshotTries = 0;
                var picture = document.createElement('canvas');
                picture.width = w;
                picture.height = h;
                var context = picture.getContext('2d');
                var image = context.createImageData(w, h);
                for (var y = 0; y < h; y++) image.data.set(pixels.subarray((h - 1 - y) * w * 4, (h - y) * w * 4), y * w * 4);
                context.putImageData(image, 0, 0);
                var shown = document.createElement('img');
                shown.src = picture.toDataURL('image/png');
                shown.alt = 'snapshot';
                shown.style.cssText = 'position:fixed;top:8px;right:8px;width:48%;z-index:2147483646;border:3px solid #e03030;background:#fff';
                shown.onclick = function () { shown.style.width = shown.style.width === '48%' ? '96%' : '48%'; };
                document.documentElement.appendChild(shown);
                log('snapshot shown: the app\'s drawing buffer ' + w + 'x' + h + (drawn ? '' : ', empty'));
            }
            var animationFrame = window.requestAnimationFrame;
            if (animationFrame) {
                window.requestAnimationFrame = function (callback) {
                    return animationFrame.call(window, function (time) {
                        callback(time);
                        countFrame(time);
                        afterFrame();
                    });
                };
            }
            // How the main thread keeps up, every 10 s while the page is shown: frames drawn per second
            // (only while the app animates), the longest gap between two, and how late a 100 ms
            // timer fires at worst. Logged once the app is ready, and only when something drew.
            var frameCount = 0, lastFrame = 0, longestGap = 0, timerLate = 0, lastTick = 0;
            function countFrame(time) {
                if (lastFrame) longestGap = Math.max(longestGap, time - lastFrame);
                lastFrame = time;
                frameCount++;
            }
            setInterval(function () {
                var now = performance.now();
                if (lastTick) timerLate = Math.max(timerLate, now - lastTick - 100);
                lastTick = now;
            }, 100);
            setInterval(function () {
                if (current === 'ready' && frameCount > 0 && document.visibilityState === 'visible') {
                    log('main thread: ' + (frameCount / 10).toFixed(1) + ' frames/s, longest gap ' + Math.round(longestGap) +
                        ' ms, timers up to ' + Math.round(timerLate) + ' ms late');
                }
                frameCount = 0; longestGap = 0; timerLate = 0; lastFrame = 0;
            }, 10000);
            window.addEventListener('resize', function () { log('resize ' + window.innerWidth + 'x' + window.innerHeight); });
            document.addEventListener('visibilitychange', function () { log('page ' + document.visibilityState); });
            window.addEventListener('pagehide', function () { log('page hidden (pagehide)'); });
            window.addEventListener('pageshow', function (event) { if (event.persisted) log('page shown again from the back/forward cache'); });

            // On iPhone and iPad the JavaScript build, where the WebAssembly one would run too: in
            // Edge on an iPad (iPadOS 27.2) the WebAssembly build laid text out wrongly (letters
            // stacked, labels on top of each other) and then left the page white, while the
            // JavaScript build showed the app right; Safari on a Mac runs the WebAssembly build
            // well. "?build=wasm" or "?build=js" chooses either for a test. The loader asks
            // WebAssembly.validate once; to choose the JavaScript build, that one answer is no.
            var forced = (location.search.match(/[?&]build=(js|wasm)\b/) || [])[1];
            var apple = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1); // an iPad asking for desktop pages
            if (forced === 'js' || (!forced && apple && gc)) {
                var validate = WebAssembly.validate;
                WebAssembly.validate = function () {
                    WebAssembly.validate = validate;
                    return false;
                };
            }
            log('build ' + (forced ? 'chosen in the address: ' + forced : apple ? 'JavaScript on iPhone and iPad' : 'as the browser can'));

            var app = document.createElement('script');
            app.onload = function () { log('loader loaded'); };
            app.onerror = function () { log('loader failed to load'); };
            app.src = 'webApp.js';
            document.body.appendChild(app);
            log('phase page');
        })();
    </script>
</body>
</html>
