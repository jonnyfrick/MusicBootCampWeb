<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sound test</title>
    <style>
        :root { color-scheme: light dark; --bg: #fff; --fg: #111; --button: #e8e8ee; }
        @media (prefers-color-scheme: dark) { :root { --bg: #16181d; --fg: #eee; --button: #2c2f38; } }
        body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px -apple-system, system-ui, sans-serif; }
        h1 { font-size: 20px; }
        .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
        button { font: inherit; padding: 12px 14px; border: 0; border-radius: 8px; background: var(--button); color: var(--fg); }
        label { display: block; margin: 8px 0; }
        pre { white-space: pre-wrap; font-size: 13px; }
    </style>
</head>
<body>
<!-- A test of the browser's audio without the app: the same sine tone at 48 and 44.1 kHz, played by
     the browser itself (oscillator) and by an AudioWorklet as the app's player does, optionally
     with the microphone open. On an iPad 7 with iPadOS 16.3 the app sounded like a ring modulator. -->
<h1>Sound test</h1>
<p>Each button plays 440 Hz for 2 seconds. A clean tone is a plain beep; a broken one rattles, warbles or has a second tone.</p>
<label><input type="checkbox" id="mic"> Microphone open while playing</label>
<div class="row">
    <button data-rate="48000" data-way="osc">48 kHz browser</button>
    <button data-rate="44100" data-way="osc">44.1 kHz browser</button>
    <button data-rate="" data-way="osc">default browser</button>
</div>
<div class="row">
    <button data-rate="48000" data-way="worklet">48 kHz worklet</button>
    <button data-rate="44100" data-way="worklet">44.1 kHz worklet</button>
    <button data-rate="" data-way="worklet">default worklet</button>
</div>
<button id="copy">Copy log</button>
<pre id="log"></pre>
<script>
    var logged = [];
    function log(line) {
        logged.push(line);
        document.getElementById('log').textContent = logged.join('\n');
    }
    log(navigator.userAgent);

    var worklet = 'registerProcessor("sine", class extends AudioWorkletProcessor {' +
        ' constructor() { super(); this.phase = 0; }' +
        ' process(inputs, outputs) { var out = outputs[0][0];' +
        '  for (var i = 0; i < out.length; i++) { out[i] = 0.3 * Math.sin(this.phase); this.phase += 2 * Math.PI * 440 / sampleRate; }' +
        '  return true; } });';
    var stream = null;

    async function play(rate, way) {
        var wantMic = document.getElementById('mic').checked;
        if (wantMic && !stream) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
            } catch (e) {
                log('microphone failed: ' + e);
            }
        }
        if (!wantMic && stream) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            stream = null;
        }
        var options = { latencyHint: 'interactive' };
        if (rate) options.sampleRate = Number(rate);
        var context;
        try {
            context = new AudioContext(options);
        } catch (e) {
            log((rate || 'default') + ' Hz: context failed: ' + e);
            return;
        }
        await context.resume();
        var source = null;
        if (stream) {
            try {
                source = context.createMediaStreamSource(stream);
                var silent = context.createGain();
                silent.gain.value = 0;
                source.connect(silent).connect(context.destination);
            } catch (e) {
                log('microphone into the context failed: ' + e);
            }
        }
        var node;
        try {
            if (way === 'osc') {
                node = context.createOscillator();
                node.frequency.value = 440;
                var gain = context.createGain();
                gain.gain.value = 0.3;
                node.connect(gain).connect(context.destination);
                node.start();
            } else {
                await context.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: 'application/javascript' })));
                node = new AudioWorkletNode(context, 'sine');
                node.connect(context.destination);
            }
        } catch (e) {
            log(way + ' failed: ' + e);
        }
        log((rate || 'default') + ' asked, ' + way + ': context ' + context.sampleRate + ' Hz, base latency ' +
            context.baseLatency + ', output latency ' + context.outputLatency + ', ' + context.state +
            (stream ? ', microphone ' + JSON.stringify(stream.getAudioTracks()[0].getSettings()) : ', no microphone'));
        setTimeout(function () { context.close(); }, 2000);
    }

    document.querySelectorAll('button[data-way]').forEach(function (b) {
        b.onclick = function () { play(b.dataset.rate, b.dataset.way); };
    });
    document.getElementById('copy').onclick = function () {
        navigator.clipboard.writeText(logged.join('\n')).then(function () { log('(copied)'); }, function (e) { log('copy failed: ' + e); });
    };
</script>
</body>
</html>
